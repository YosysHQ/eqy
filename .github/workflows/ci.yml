name: "Build"

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * *'

jobs:
  build_oss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Install OSS-Cad-Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker run --rm -v $(pwd):/work -v /home/runner/work/_temp/oss-cad-suite:/tabby yosyshq/plugin_build_x64:22.04 make

      - name: Install
        run: |
          cp /home/runner/work/_temp/oss-cad-suite/bin/eqy .
          make install PREFIX=/home/runner/work/_temp/oss-cad-suite
          cp -f /home/runner/work/_temp/oss-cad-suite/bin/eqy /home/runner/work/_temp/oss-cad-suite/libexec/.
          cp -f eqy /home/runner/work/_temp/oss-cad-suite/bin/.

      - name: Test
        run: make test

  build_verific:
    runs-on: [self-hosted, linux, x64, fast]
    steps:
      - name: Checkout EQY
        uses: actions/checkout@v7

      - name: Checkout Yosys
        uses: actions/checkout@v7
        with:
          repository: 'YosysHQ/yosys'
          path: 'yosys'
          submodules: true

      - name: Runtime environment
        run: |
          echo "procs=$(nproc)" >> $GITHUB_ENV
          rm -rf .local

      - name: Build Yosys
        run: |
          cd yosys
          rm -rf build Configuration.cmake
          echo 'set(CMAKE_C_COMPILER clang CACHE STRING "")' >> Configuration.cmake
          echo 'set(CMAKE_CXX_COMPILER clang++ CACHE STRING "")' >> Configuration.cmake
          echo 'set(YOSYS_COMPILER_LAUNCHER ccache CACHE STRING "")' >> Configuration.cmake
          echo 'set(YOSYS_VERIFIC_DIR "/usr/local/src/verific_lib" CACHE STRING "")' >> Configuration.cmake

          cmake -C Configuration.cmake -B build . -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/.local -DCMAKE_BUILD_TYPE=Debug

          cmake --build build -j${{ env.procs }}
          cmake --build build --target install

      - name: Checkout SBY
        uses: actions/checkout@v7
        with:
          repository: 'YosysHQ/sby'
          path: 'sby'

      - name: Build SBY
        run: |
          make -C sby install DESTDIR=${GITHUB_WORKSPACE}/.local PREFIX=

      - name: EQY Coverage
        run: |
          make install DESTDIR=${GITHUB_WORKSPACE}/.local PREFIX= COVERAGE=1
          make coverage
          lcov_cobertura coverage.info --demangle

      - name: Report
        if: (github.event_name != 'schedule')
        run: |
          python3 .github/workflows/get_markdown.py coverage.xml 90
